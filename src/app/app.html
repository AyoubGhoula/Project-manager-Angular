<section class="relative min-h-screen overflow-hidden px-4 py-8 sm:px-6 lg:px-8">
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <div class="absolute -left-24 top-0 h-72 w-72 rounded-full bg-cyan-300/30 blur-3xl"></div>
    <div class="absolute right-0 top-24 h-72 w-72 rounded-full bg-amber-300/25 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 h-80 w-80 rounded-full bg-sky-400/10 blur-3xl"></div>
  </div>

  <div class="relative mx-auto max-w-7xl">
    <header class="rounded-[2rem] border border-white/70 bg-white/75 p-6 shadow-xl shadow-slate-900/5 backdrop-blur xl:p-8">
      <div class="flex flex-col gap-6 xl:flex-row xl:items-end xl:justify-between">
        <div class="max-w-3xl">
          <p class="text-xs font-semibold uppercase tracking-[0.35em] text-cyan-600">Angular workspace</p>
          <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-slate-950 sm:text-5xl">
            {{ title() }}
          </h1>
          <p class="mt-4 max-w-2xl text-base leading-7 text-slate-600">
            Un espace de gestion de projets plus moderne, centre sur la lisibilite, les
            popups utiles et les actions rapides.
          </p>
        </div>

        <nav class="flex flex-wrap gap-3">
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-slate-950 text-slate-900 shadow-lg shadow-slate-900/10"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:border-cyan-200 hover:bg-cyan-50 hover:text-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-300"
          >
            Dashboard
          </a>
          <a
            routerLink="/projects"
            routerLinkActive="bg-slate-950 text-slate-900 shadow-lg shadow-slate-900/10"
            class="rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:border-cyan-200 hover:bg-cyan-50 hover:text-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-300"
          >
            Projects
          </a>
          <a
            routerLink="/reactive-forms"
            routerLinkActive="bg-slate-950 text-slate-900 shadow-lg shadow-slate-900/10"
            class="rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:border-cyan-200 hover:bg-cyan-50 hover:text-cyan-700 focus:outline-none focus:ring-2 focus:ring-cyan-300"
          >
            Reactive Forms
          </a>
        </nav>
      </div>
    </header>

    <main class="mt-8 rounded-[2rem] border border-white/70 bg-white/65 p-4 shadow-xl shadow-slate-900/5 backdrop-blur sm:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</section>
