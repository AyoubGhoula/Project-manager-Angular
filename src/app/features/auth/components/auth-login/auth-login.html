<section class="space-y-6">
  <header class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-cyan-600">Authentification</p>
    <h2 class="mt-2 text-3xl font-bold text-slate-950">Connexion</h2>
    <p class="mt-3 text-sm text-slate-600">Accedez a vos projets et donnees personnelles.</p>
  </header>

  <article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <form [formGroup]="loginForm" (ngSubmit)="submitForm()" class="space-y-4" novalidate>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          [class.is-invalid]="
            validationService.hasError(email, 'required') ||
            validationService.hasError(email, 'email')
          "
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-cyan-500"
        />
        <p *appShowError="email; errorType: 'required'" class="mt-1 text-sm text-rose-600">
          {{ validationService.getErrorMessage(email, 'required') }}
        </p>
        <p *appShowError="email; errorType: 'email'" class="mt-1 text-sm text-rose-600">
          {{ validationService.getErrorMessage(email, 'email') }}
        </p>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="login-password">Mot de passe</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          [class.is-invalid]="validationService.hasError(password, 'required')"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-cyan-500"
        />
        <p *appShowError="password; errorType: 'required'" class="mt-1 text-sm text-rose-600">
          {{ validationService.getErrorMessage(password, 'required') }}
        </p>
      </div>

      <p *ngIf="errorMessage" class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">
        {{ errorMessage }}
      </p>

      <div class="flex flex-wrap gap-3">
        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="rounded-xl bg-slate-950 px-4 py-2.5 text-sm font-semibold text-white disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>
        <a
          routerLink="/auth/register"
          class="rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700"
        >
          Creer un compte
        </a>
      </div>
    </form>
  </article>
</section>
