<section class="space-y-6">
  <header class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-cyan-600">TP Reactive Forms</p>
    <h2 class="mt-2 text-3xl font-bold text-slate-950">Parcours par parties</h2>
    <p class="mt-3 text-sm text-slate-600">
      Chaque page correspond a une partie du TP avec un exemple clair et isole.
    </p>
  </header>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    <a
      *ngFor="let card of cards"
      [routerLink]="card.route"
      class="group rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:border-cyan-200 hover:shadow-lg"
    >
      <div class="flex items-center justify-between">
        <span class="rounded-full bg-cyan-50 px-3 py-1 text-xs font-semibold text-cyan-700">
          {{ card.badge }}
        </span>
        <span class="text-xs font-semibold text-slate-400 group-hover:text-cyan-600">Ouvrir</span>
      </div>
      <h3 class="mt-4 text-lg font-semibold text-slate-900">{{ card.title }}</h3>
      <p class="mt-2 text-sm text-slate-600">{{ card.description }}</p>
    </a>
  </div>
</section>
